services:
  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-elmostafa}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Must set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-elmostafa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=50
        -c random_page_cost=1.1
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_NAMESPACE:-Shico100100/el-mostafa}/backend:latest
    container_name: erp-backend
    pull_policy: always
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-elmostafa}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Must set DATABASE_PASSWORD}
      DATABASE_SYNCHRONIZE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Must set AUTH_JWT_SECRET}
      AUTH_JWT_TOKEN_EXPIRES_IN: ${AUTH_JWT_TOKEN_EXPIRES_IN:-1d}
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:?Must set AUTH_REFRESH_SECRET}
      AUTH_REFRESH_TOKEN_EXPIRES_IN: ${AUTH_REFRESH_TOKEN_EXPIRES_IN:-7d}
      AUTH_FORGOT_SECRET: ${AUTH_FORGOT_SECRET:?Must set AUTH_FORGOT_SECRET}
      AUTH_FORGOT_TOKEN_EXPIRES_IN: ${AUTH_FORGOT_TOKEN_EXPIRES_IN:-30m}
      AUTH_CONFIRM_EMAIL_SECRET: ${AUTH_CONFIRM_EMAIL_SECRET:?Must set AUTH_CONFIRM_EMAIL_SECRET}
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: ${AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN:-1d}
      FRONTEND_DOMAIN: https://${DOMAIN:-localhost}
      MAIL_HOST: ${MAIL_HOST:-maildev}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_DEFAULT_EMAIL: ${MAIL_DEFAULT_EMAIL:-noreply@elmostafa.com}
      MAIL_DEFAULT_NAME: ELMostafa
      MAIL_IGNORE_TLS: ${MAIL_IGNORE_TLS:-true}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_REQUIRE_TLS: ${MAIL_REQUIRE_TLS:-false}
      FILE_DRIVER: ${FILE_DRIVER:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_NAMESPACE:-Shico100100/el-mostafa}/frontend:latest
    container_name: erp-frontend
    pull_policy: always
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
