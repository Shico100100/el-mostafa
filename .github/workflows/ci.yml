name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Lint & typecheck backend
        working-directory: backend
        run: npm run lint && npm run typecheck

      - name: Lint & typecheck frontend
        working-directory: frontend
        run: npm run lint && npm run typecheck

      - name: Backend unit tests
        working-directory: backend
        run: npm test

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

  smoke:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elmostafa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_TYPE: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: elmostafa_test
      DATABASE_SYNCHRONIZE: 'false'
      DATABASE_MIGRATIONS_RUN: 'true'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      APP_PORT: 3001
      API_PREFIX: api
      AUTH_JWT_SECRET: ci_dummy_jwt_secret_32chars_long_minimum
      AUTH_JWT_TOKEN_EXPIRES_IN: 1d
      AUTH_REFRESH_SECRET: ci_dummy_refresh_secret_32chars_long
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
      AUTH_FORGOT_SECRET: ci_dummy_forgot_secret_32chars_long_ok
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
      AUTH_CONFIRM_EMAIL_SECRET: ci_dummy_confirm_secret_32chars_long
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      FRONTEND_DOMAIN: http://localhost:3000
      BACKEND_DOMAIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      FILE_DRIVER: local
      MAIL_HOST: localhost
      MAIL_DEFAULT_EMAIL: noreply@example.com
      MAIL_DEFAULT_NAME: CI
      MAIL_IGNORE_TLS: 'true'
      MAIL_SECURE: 'false'
      MAIL_REQUIRE_TLS: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Write backend .env
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          APP_PORT=3001
          API_PREFIX=api
          DATABASE_TYPE=postgres
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_USERNAME=postgres
          DATABASE_PASSWORD=postgres
          DATABASE_NAME=elmostafa_test
          DATABASE_SYNCHRONIZE=true
          DATABASE_MIGRATIONS_RUN=false
          REDIS_HOST=localhost
          REDIS_PORT=6379
          FRONTEND_DOMAIN=http://localhost:3000
          BACKEND_DOMAIN=http://localhost:3001
          AUTH_JWT_SECRET=ci_dummy_jwt_secret_32chars_long_minimum
          AUTH_JWT_TOKEN_EXPIRES_IN=1d
          AUTH_REFRESH_SECRET=ci_dummy_refresh_secret_32chars_long
          AUTH_REFRESH_TOKEN_EXPIRES_IN=7d
          AUTH_FORGOT_SECRET=ci_dummy_forgot_secret_32chars_long_ok
          AUTH_FORGOT_TOKEN_EXPIRES_IN=30m
          AUTH_CONFIRM_EMAIL_SECRET=ci_dummy_confirm_secret_32chars_long
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN=1d
          FILE_DRIVER=local
          MAIL_HOST=localhost
          MAIL_DEFAULT_EMAIL=noreply@example.com
          MAIL_DEFAULT_NAME=CI
          MAIL_IGNORE_TLS=true
          MAIL_SECURE=false
          MAIL_REQUIRE_TLS=false
          EOF

      - name: Write frontend .env.local
        working-directory: frontend
        run: echo "NEXT_PUBLIC_API_URL=http://localhost:3001" > .env.local

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync entity schema
        working-directory: backend
        run: npm run typeorm -- --dataSource=src/database/data-source.ts schema:sync

      - name: Start services & wait for health
        working-directory: backend
        run: |
          node dist/main > ../backend-out.log 2>&1 &
          (cd ../frontend && npm run start > ../frontend-out.log 2>&1) &

          backend_ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/v1/health >/dev/null 2>&1; then backend_ok=1; echo "backend up"; break; fi
            sleep 2
          done

          frontend_ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login/ >/dev/null 2>&1; then frontend_ok=1; echo "frontend up"; break; fi
            sleep 2
          done

          if [ "$backend_ok" != "1" ] || [ "$frontend_ok" != "1" ]; then
            [ "$backend_ok" != "1" ] && echo "::error::Backend did not become healthy"
            [ "$frontend_ok" != "1" ] && echo "::error::Frontend did not come up"
            echo "===== backend-out.log ====="
            cat ../backend-out.log 2>/dev/null || true
            echo "===== frontend-out.log ====="
            cat ../frontend-out.log 2>/dev/null || true
            echo "===== health probe ====="
            curl -sS -i http://localhost:3001/api/v1/health || true
            echo
            exit 1
          fi

      - name: Run backend integration tests
        working-directory: backend
        run: npm run test:integration
        env:
          DATABASE_SYNCHRONIZE: 'false'

      - name: Run backend e2e tests
        working-directory: backend
        run: npm run test:e2e
        env:
          DATABASE_SYNCHRONIZE: 'false'
